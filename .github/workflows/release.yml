name: Release

on:
  schedule:
    - cron: "43 5 * * *"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/*release*
      - scripts/fixtures/**
      - scripts/publish-maven.py
      - plugin/**
      - crates/**
      - jvm/**
      - Cargo.*
  workflow_dispatch:
    inputs:
      channel:
        description:
          "`nightly` publishes `<workspace version>-nightly.<UTC commit time>.g<commit>`; `release` publishes the
          workspace version"
        type: choice
        options: [nightly, release]
        default: nightly

permissions:
  contents: read

# Publishing runs one at a time, so a version is never published concurrently.
concurrency:
  group: window-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHANNEL: ${{ inputs.channel || 'nightly' }}
  # The rpp in mise.toml; the registry action requires it as an input.
  RPP_VERSION: 0.1.0-nightly.20261008133812.g121b31a3e9a2

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@v6
      - id: base
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print("version=" + tomllib.load(source)["workspace"]["package"]["version"])
          PY
      - id: version
        uses: chunkzero/release-tools/version@v1
        with:
          base: ${{ steps.base.outputs.version }}
          channel: ${{ env.CHANNEL }}

  package:
    needs: version
    # A commit's version is fixed, so an already published version only needs registering.
    if: needs.version.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: rust java just chunkzero:rpp-nightly
      - name: Check rpp matches RPP_VERSION
        run: test "$(rpp --version)" = "rpp $RPP_VERSION"
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - run: just plugin
      - run: scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: window-release
          path: dist/
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: java just chunkzero:rpp-nightly
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: window-release
          path: dist
      - name: Check packaged plugin and generated JVM consumer
        run: scripts/check-release.sh

  # Maven first: the plugin's generated Kotlin pins JVM artifacts that must already resolve.
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [version, package, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REPOSITORY: ${{ inputs.channel == 'release' && 'releases' || 'nightlies' }}
      MAVEN_URL: https://maven.chunkzero.com${{ inputs.channel != 'release' && '/nightlies' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: window-release
          path: dist
      - uses: chunkzero/maven-r2@v1
        with:
          version: v0.1.0
      - name: Publish the Maven artifacts
        env:
          MAVEN_R2_SERVER: https://maven.chunkzero.com
          MAVEN_R2_TOKEN: ${{ secrets.MAVEN_R2_TOKEN }}
        run: |
          : "${MAVEN_R2_TOKEN:?Set the Maven R2 publishing token secret}"
          maven="$RUNNER_TEMP/window-$VERSION-maven"
          tar -xzf "dist/window-$VERSION-maven.tar.gz" -C "$RUNNER_TEMP"
          maven-r2 publish --repository "default/$REPOSITORY" -- python3 scripts/publish-maven.py "$maven" "$VERSION"
          pom="com/chunkzero/window/window-runtime/$VERSION/window-runtime-$VERSION.pom"
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 "$MAVEN_URL/$pom" -o "$RUNNER_TEMP/published.pom"
          cmp "$RUNNER_TEMP/published.pom" "$maven/$pom"
      - uses: chunkzero/release-tools/publish@v1
        with:
          version: ${{ needs.version.outputs.version }}
          directory: dist
          title: Window

  register:
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.version.result ==
      'success' && (needs.publish.result == 'success' || needs.version.outputs.published == 'true')
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the published plugin description
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern packed.json --dir dist
      - id: registry-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REGISTRY_APP_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
          owner: chunkzero
          repositories: rpp-registry
      - name: Open registry publication PR
        uses: chunkzero/rpp/.github/actions/publish-plugin@7cc238988bf204f2804ff5ac4c6d34276fb002eb
        with:
          rpp-version: ${{ env.RPP_VERSION }}
          packed-directory: dist
          release-tag: v${{ needs.version.outputs.version }}
          registry-token: ${{ steps.registry-token.outputs.token }}
